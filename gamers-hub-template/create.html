<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/style.css">
  <title>Gamers Hub</title>
</head>

<body>
  <header class="site-header">
    <div class="container">
      <a class="logo" href="index.html">Gamers<span>Hub</span></a>
      <!-- Navigation -->
      <nav class="nav" aria-label="Main">
        <a href="catalog.html">Catalog</a>
        <!-- Logged-in users -->
        <div id="user">
          <a href="create.html">Add Topic</a>
          <span class="user">Hi, NightOwl</span>
          <a href="index.html">Logout</a>
        </div>
        <!-- Guest users -->
        <div id="guest">
          <a href="login.html">Login</a>
          <a href="register.html">Register</a>
        </div>
      </nav>
    </div>
  </header>

  <main class="container">
  <section class="page" id="add-page">
    <h1>Start a topic</h1>
    <form class="form-card" onsubmit="return false" novalidate>
      <div class="field invalid">
        <label for="title">Title</label>
        <input id="title" type="text" value="Help" aria-describedby="title-err">
        <p class="error-text" id="title-err">Title must be between 5 and 100 characters.</p>
      </div>

      <div class="field">
        <label for="game">Game</label>
        <input id="game" type="text" placeholder="e.g. Elden Ring">
      </div>

      <div class="form-row">
        <div class="field">
          <label for="platform">Platform</label>
          <select id="platform">
            <option value="">Select platform</option><option>PC</option><option>PlayStation</option>
            <option>Xbox</option><option>Switch</option><option>Mobile</option>
          </select>
        </div>
        <div class="field">
          <label for="category">Category</label>
          <select id="category">
            <option value="">Select category</option><option>Help &amp; Tips</option><option>News</option>
            <option>Looking for Group</option><option>Reviews</option><option>General</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="image">Image URL (optional)</label>
        <input id="image" type="url" placeholder="https://...">
      </div>

      <div class="field">
        <label for="content">Content</label>
        <textarea id="content" placeholder="At least 20 characters"></textarea>
      </div>

      <button class="btn btn-primary" type="submit">Publish topic</button>
      <a class="btn" href="catalog.html">Cancel</a>
    </form>
  </section>
  </main>

  <footer class="site-footer">
  <div class="container">Gamers Hub &copy; 2026. A community project.</div>
</footer>
</body>

</html>
