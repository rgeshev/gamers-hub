<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/style.css">
  <title>Gamers Hub</title>
</head>

<body>
  <header class="site-header">
    <div class="container">
      <a class="logo" href="index.html">Gamers<span>Hub</span></a>
      <!-- Navigation -->
      <nav class="nav" aria-label="Main">
        <a href="catalog.html">Catalog</a>
        <!-- Logged-in users -->
        <div id="user">
          <a href="create.html">Add Topic</a>
          <span class="user">Hi, NightOwl</span>
          <a href="index.html">Logout</a>
        </div>
        <!-- Guest users -->
        <div id="guest">
          <a href="login.html">Login</a>
          <a href="register.html">Register</a>
        </div>
      </nav>
    </div>
  </header>

  <main class="container">
  <section class="page" id="register-page">
    <h1>Create your account</h1>
    <form class="form-card" onsubmit="return false" novalidate>
      <div class="field">
        <label for="r-name">Username</label>
        <input id="r-name" type="text" autocomplete="username">
      </div>
      <div class="field">
        <label for="r-email">Email</label>
        <input id="r-email" type="email" autocomplete="email">
      </div>
      <div class="field">
        <label for="r-pass">Password</label>
        <input id="r-pass" type="password" autocomplete="new-password">
      </div>
      <div class="field invalid">
        <label for="r-repeat">Repeat password</label>
        <input id="r-repeat" type="password" autocomplete="new-password">
        <p class="error-text">Passwords do not match.</p>
      </div>
      <button class="btn btn-primary" type="submit">Create account</button>
      <p class="form-note">Already a member? <a href="login.html">Log in</a></p>
    </form>
  </section>
  </main>

  <footer class="site-footer">
  <div class="container">Gamers Hub &copy; 2026. A community project.</div>
</footer>
</body>

</html>
